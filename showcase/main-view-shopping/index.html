<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Showcase — MainView Shopping v-5.4.0 (domain-agnostic engine)</title>

  <!-- MyIO standard font (Nunito) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" />

  <!-- v-5.4.0 dashboard styles -->
  <link rel="stylesheet" href="../../src/thingsboard/main-dashboard-shopping/v-5.4.0/styles.css" />

  <style>
    /* Flex ROW: dashboard fills the left, cockpit is a vertical sidebar on the RIGHT. */
    html, body { height: 100%; }
    body { margin: 0; font-family: 'Nunito', Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:#f4f4f7; display:flex; flex-direction:row; height:100vh; overflow:hidden; }
    #myio-root { flex: 1 1 auto; min-width: 0; min-height: 0; }
    /* #sc-stage: neutral flex wrapper around the dashboard. */
    #sc-stage { flex: 1 1 auto; min-width: 0; min-height: 0; display: flex; }
    #sc-stage > #myio-root { flex: 1 1 auto; min-width: 0; min-height: 0; }
    #sc-cockpit button.sc-ghost.active { background:#6c5ce7; border-color:#6c5ce7; opacity:1; }

    /* Mobile preview: an iframe at a phone width gives a REAL narrow viewport, so the dashboard's
       own @media (max-width) rules fire (element-resizing alone does NOT trigger media queries). */
    #sc-mobile-overlay { position:fixed; inset:0; z-index:10001; background:rgba(11,11,20,.78); display:flex; align-items:center; justify-content:center; }
    #sc-mobile-overlay .sc-phone { display:flex; flex-direction:column; width:390px; max-width:94vw; height:844px; max-height:94vh; background:#14141f; border-radius:28px; padding:10px; box-shadow:0 0 0 2px #2a2a3a, 0 24px 70px rgba(0,0,0,.6); }
    #sc-mobile-overlay .sc-phone-bar { display:flex; align-items:center; justify-content:space-between; color:#cbd5e1; font-size:11px; padding:4px 6px 8px; }
    #sc-mobile-overlay .sc-phone-bar button { background:transparent; border:1px solid rgba(255,255,255,.35); color:#fff; border-radius:6px; cursor:pointer; padding:2px 9px; font-size:12px; }
    #sc-mobile-overlay .sc-phone-screen { flex:1 1 auto; width:100%; border:0; border-radius:20px; background:#fff; }

    /* Embedded mobile mode (?embed=mobile): hide the cockpit, dashboard fills the iframe viewport. */
    body.embed-mobile { flex-direction:column; }
    body.embed-mobile #sc-cockpit, body.embed-mobile #sc-login-modal { display:none !important; }
    body.embed-mobile #sc-stage { flex:1 1 auto; }
    body.embed-mobile #sc-stage > #myio-root { width:100%; height:100%; border-radius:0; box-shadow:none; }

    #sc-cockpit { flex: 0 0 340px; display:flex; flex-direction:column; background:#1f1147; color:#fff; font-size:12px; overflow:hidden; transition: flex-basis .2s ease; }
    #sc-cockpit .sc-head { flex:0 0 auto; display:flex; align-items:center; gap:8px; padding:10px 12px; border-bottom:1px solid rgba(255,255,255,.15); }
    #sc-cockpit .sc-title { white-space:nowrap; }
    /* sc-body = 3 zones: scrollable fields (top) · collapsible console (mid) · fixed buttons (bottom) */
    #sc-cockpit .sc-body { flex:1 1 auto; min-height:0; display:flex; flex-direction:column; overflow:hidden; }
    #sc-cockpit .sc-scroll { flex:1 1 auto; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:5px; padding:10px 12px; }
    #sc-cockpit .sc-console { flex:0 0 auto; border-top:1px solid rgba(255,255,255,.15); }
    #sc-cockpit .sc-console-head { padding:4px 12px; }
    #sc-cockpit .sc-console.collapsed #sc-log { display:none; }
    #sc-cockpit label { opacity:.8; margin-top:4px; }
    #sc-cockpit input { font-size:12px; padding:6px; border-radius:6px; border:1px solid #ccc; width:100%; box-sizing:border-box; }
    #sc-cockpit select { font-size:12px; padding:6px; border-radius:6px; border:1px solid #ccc; width:100%; box-sizing:border-box; color:#111; }
    #sc-cockpit input[type=color] { height:30px; padding:2px; }
    #sc-cockpit .sc-checkbox { display:flex; align-items:center; gap:8px; margin-top:6px; }
    #sc-cockpit .sc-checkbox input { width:auto; }
    #sc-cockpit fieldset.sc-fieldset { border:1px solid rgba(255,255,255,.22); border-radius:8px; padding:4px 10px 10px; margin-top:10px; }
    #sc-cockpit fieldset.sc-fieldset > legend { font-weight:600; font-size:11px; opacity:.9; padding:0 4px; }
    #sc-cockpit fieldset.sc-fieldset > legend.sc-fs-legend { cursor:pointer; user-select:none; }
    #sc-cockpit fieldset.sc-fieldset.collapsed { padding-bottom:4px; }
    #sc-cockpit fieldset.sc-fieldset.collapsed > .sc-fs-body { display:none; }
    #sc-cockpit .sc-fs-ico { display:inline-block; width:12px; font-size:9px; }
    /* environment selector (LOCAL | PROD) */
    #sc-cockpit .sc-envtab { display:flex; gap:0; margin:10px 0 2px; border:1px solid rgba(255,255,255,.3); border-radius:8px; overflow:hidden; }
    #sc-cockpit .sc-envtab button { flex:1; background:transparent; color:#fff; border:none; border-radius:0; padding:7px 0; font-size:12px; font-weight:600; cursor:pointer; opacity:.7; }
    #sc-cockpit .sc-envtab button + button { border-left:1px solid rgba(255,255,255,.3); }
    #sc-cockpit .sc-envtab button.active { background:#6c5ce7; opacity:1; }
    #sc-cockpit .sc-actions { flex:0 0 auto; display:flex; flex-direction:column; gap:6px; padding:10px 12px; border-top:1px solid rgba(255,255,255,.15); background:#1f1147; }
    #sc-cockpit button { font-size:12px; padding:8px 12px; border:none; border-radius:6px; background:#6c5ce7; color:#fff; cursor:pointer; }
    #sc-cockpit button:hover { background:#5a4bd6; }
    #sc-cockpit button.sc-ghost { background:transparent; border:1px solid rgba(255,255,255,.4); padding:4px 9px; }
    #sc-cockpit button.sc-ghost:hover { background:rgba(255,255,255,.12); }
    /* collapsed: cockpit shrinks to a thin strip, only the toggle stays visible */
    body.console-collapsed #sc-cockpit { flex-basis: 46px; }
    body.console-collapsed #sc-cockpit .sc-body,
    body.console-collapsed #sc-cockpit .sc-title { display:none; }

    #sc-log { max-height:160px; overflow:auto; margin:0 12px 10px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size:11px; background:#0b0b14; color:#9ef1c0; padding:8px; border-radius:6px; }
    #sc-log .err { color:#ff8080; }
    #sc-log .warn { color:#ffd479; }
    #sc-log .info { color:#9ecbff; }

    /* ---- auth status + login modal (inspired by presetup-nextjs LoginForm) ---- */
    #sc-auth { font-size:11.5px; padding:6px 8px; border-radius:6px; background:rgba(255,255,255,.08); }
    #sc-auth.ok { color:#9ef1c0; }
    #sc-auth.no { color:#ffd479; }
    .sc-modal-overlay { position:fixed; inset:0; background:rgba(15,17,30,.6); display:none; align-items:center; justify-content:center; z-index:10000; }
    .sc-modal-overlay.open { display:flex; }
    .sc-login { width:360px; max-width:92vw; background:#fff; color:#1e293b; border-radius:14px; padding:24px; box-shadow:0 20px 60px rgba(0,0,0,.35); }
    .sc-login .sc-close { float:right; background:none; border:none; font-size:20px; line-height:1; color:#94a3b8; cursor:pointer; }
    .sc-login .sc-logo { width:46px; height:46px; border-radius:12px; background:#6c5ce7; display:flex; align-items:center; justify-content:center; margin:0 auto; font-size:22px; }
    .sc-login h2 { margin:14px 0 2px; text-align:center; font-size:18px; }
    .sc-login p.sub { margin:0 0 8px; text-align:center; color:#64748b; font-size:12.5px; }
    .sc-login label { display:block; font-size:12px; font-weight:600; color:#334155; margin:12px 0 4px; }
    .sc-login input { width:100%; box-sizing:border-box; padding:9px 10px; border:1px solid #cbd5e1; border-radius:8px; font-size:13px; }
    .sc-login .pwd { position:relative; }
    .sc-login .pwd button { position:absolute; right:4px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; padding:6px; }
    .sc-login .sc-err { margin-top:12px; background:#fef2f2; border:1px solid #fecaca; color:#b91c1c; padding:8px 10px; border-radius:8px; font-size:12.5px; }
    .sc-login .sc-submit { width:100%; margin-top:18px; padding:10px; border:none; border-radius:8px; background:#6c5ce7; color:#fff; font-size:14px; font-weight:600; cursor:pointer; }
    .sc-login .sc-submit:disabled { opacity:.6; cursor:not-allowed; }
    .sc-spin { display:inline-block; width:14px; height:14px; border:2px solid rgba(255,255,255,.4); border-top-color:#fff; border-radius:50%; animation:sc-rot .7s linear infinite; vertical-align:-2px; margin-right:6px; }
    @keyframes sc-rot { to { transform:rotate(360deg); } }

    /* ---- boot countdown: full-screen blur that auto-runs onInit after 6s (Cancel aborts) ---- */
    #sc-boot { position:fixed; inset:0; z-index:11000; display:flex; align-items:center; justify-content:center;
      background:rgba(15,17,30,.55); backdrop-filter:blur(16px) saturate(120%); -webkit-backdrop-filter:blur(16px) saturate(120%); }
    #sc-boot.hidden { display:none; }
    #sc-boot .sc-boot-card { text-align:center; color:#fff; padding:32px 44px; }
    #sc-boot .sc-boot-title { font-size:19px; font-weight:700; opacity:.95; }
    #sc-boot .sc-boot-count { font-size:128px; font-weight:800; line-height:1; margin:6px 0 2px; color:#a78bfa; text-shadow:0 10px 50px rgba(124,58,237,.65); }
    #sc-boot .sc-boot-sub { font-size:13px; opacity:.8; margin-bottom:24px; }
    #sc-boot .sc-boot-cancel { font-size:14px; font-weight:600; padding:11px 30px; border:1px solid rgba(255,255,255,.5);
      border-radius:10px; background:rgba(255,255,255,.08); color:#fff; cursor:pointer; }
    #sc-boot .sc-boot-cancel:hover { background:rgba(255,255,255,.18); }
    body.embed-mobile #sc-boot { display:none !important; }   /* the iframe auto-runs; no countdown */
    /* The v-5.4.0 controller generates its DOM into the structure below. */
  </style>
</head>
<body>
  <!-- ===================== v-5.4.0 template ===================== -->
  <!-- Fetched from the REAL v-5.4.0/template.html at runtime (loadTemplate) — no inline copy → no drift. -->
  <div id="sc-stage"></div><!-- filled with v-5.4.0/template.html before onInit -->

  <!-- ===================== Showcase cockpit (right sidebar) ===================== -->
  <aside id="sc-cockpit">
    <div class="sc-head">
      <button id="sc-toggle" class="sc-ghost" title="Recolher/expandir cockpit">⟩</button>
      <strong class="sc-title">v-5.4.0 cockpit</strong>
      <button id="sc-login" class="sc-ghost sc-title" title="Login no ThingsBoard">🔑 Login TB</button>
    </div>
    <div class="sc-body">
      <!-- ZONE 1: scrollable fields -->
      <div class="sc-scroll">
        <div id="sc-auth" class="sc-auth no">🔒 sem JWT</div>
        <!-- Widget settings — rendered dynamically from settingsSchema.json (mirrors TB "Appearance"). -->
        <div id="sc-fields"><span style="opacity:.7">carregando settingsSchema.json…</span></div>
        <!-- Simulated SERVER_SCOPE customer attribute (not a widget setting): used as X-API-Key on GCDR calls. -->
        <fieldset class="sc-fieldset">
          <legend>SERVER_SCOPE attrs (simulado)</legend>
          <label for="sc-gcdrKey">X-API-Key (gcdrApiKey)</label>
          <select id="sc-gcdrKey"><!-- options loaded from config.json (gitignored) --></select>
        </fieldset>
      </div>
      <!-- ZONE 2: collapsible console -->
      <div class="sc-console" id="sc-console">
        <div class="sc-console-head">
          <button type="button" id="sc-log-toggle" class="sc-ghost">▾ console</button>
        </div>
        <div id="sc-log"></div>
      </div>
      <!-- ZONE 3: fixed action buttons (bottom) -->
      <div class="sc-actions">
        <button id="sc-run">▶ Run onInit + onDataUpdated</button>
        <button id="sc-data">⟳ onDataUpdated</button>
        <button id="sc-destroy">✖ onDestroy</button>
        <button id="sc-mobile" class="sc-ghost" title="Emular viewport mobile do dashboard/widget">📱 Emular Mobile</button>
      </div>
    </div>
  </aside>

  <!-- ===================== Login modal (real ThingsBoard /api/auth/login → localStorage.jwt_token) ===================== -->
  <div class="sc-modal-overlay" id="sc-login-modal">
    <form class="sc-login" id="sc-login-form">
      <button type="button" class="sc-close" id="sc-login-close" title="Fechar">×</button>
      <div class="sc-logo">⚡</div>
      <h2>Login ThingsBoard</h2>
      <p class="sub">Autentica no TB e salva o JWT em <code>localStorage.jwt_token</code></p>
      <div id="sc-login-err" class="sc-err" style="display:none"></div>
      <label for="sc-login-user">Usuário ou Email</label>
      <input id="sc-login-user" type="text" autocomplete="username" placeholder="seu-usuario@myio.com" />
      <label for="sc-login-pass">Senha</label>
      <div class="pwd">
        <input id="sc-login-pass" type="password" autocomplete="current-password" placeholder="••••••••" />
        <button type="button" id="sc-login-eye" title="Mostrar/ocultar senha">👁</button>
      </div>
      <button type="submit" class="sc-submit" id="sc-login-submit">Entrar</button>
    </form>
  </div>

  <!-- ===================== Boot countdown (auto-run onInit after 6s) ===================== -->
  <div id="sc-boot">
    <div class="sc-boot-card">
      <div class="sc-boot-title">Carregando dados do dashboard…</div>
      <div class="sc-boot-count" id="sc-boot-count">6</div>
      <div class="sc-boot-sub">Iniciando em <span id="sc-boot-secs">6</span>s — árvore GCDR, devices e consumo. (F5 para recarregar)</div>
      <button type="button" id="sc-boot-cancel" class="sc-boot-cancel">Cancelar</button>
    </div>
  </div>

  <!-- ===================== Dependencies ===================== -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script>
    // cache-bust the freshly-built UMD so the new RFC-0209 / agnostic symbols are present
    document.write('<script src="../../dist/myio-js-library.umd.js?v=' + Date.now() + '"><\/script>');
  </script>

  <!-- ===================== Showcase harness ===================== -->
  <script>
    // ---- mobile preview embed mode: this page is loaded inside the phone iframe ----
    // ?embed=mobile → hide the cockpit, fill the iframe viewport, and auto-run onInit.
    const EMBED_MOBILE = new URLSearchParams(location.search).get('embed') === 'mobile';
    if (EMBED_MOBILE) document.body.classList.add('embed-mobile');

    // ---- tiny event log ----
    const logEl = document.getElementById('sc-log');
    function log(kind, msg) {
      const t = new Date().toISOString().slice(11, 19);
      const div = document.createElement('div');
      div.className = kind;
      div.textContent = `[${t}] ${msg}`;
      logEl.prepend(div);
    }
    ['myio:data-ready','myio:dashboard-state','myio:energy-summary-ready','myio:water-summary-ready','myio:temperature-data-ready','myio:update-date']
      .forEach((ev) => window.addEventListener(ev, (e) => log('info', `event ${ev} ${e.detail ? JSON.stringify(e.detail).slice(0,120) : ''}`)));

    // ---- mock AllDevices rows (TB datasource shape) matching the fixture's deviceProfiles ----
    // domain is derived by the lib (getDomainFromDeviceType): HIDROMETRO*→water, TERMOSTATO→temperature, else energy.
    function deviceRows({ entityId, name, deviceType, deviceProfile, identifier, valueKey, value, status }) {
      const kv = {
        deviceType, deviceProfile, identifier,
        label: name, connectionStatus: status,
        [valueKey]: value,
      };
      return Object.entries(kv).map(([k, v]) => ({
        datasource: { entityId, entityName: name, entityLabel: name, aliasName: 'all3fs' },
        dataKey: { name: k },
        data: [[Date.now(), v]],
      }));
    }
    function buildMockData() {
      const D = [
        { entityId:'e-3f-1',   name:'Loja 101',      deviceType:'3F_MEDIDOR',         deviceProfile:'3F_MEDIDOR',         identifier:'LOJA-101', valueKey:'consumption', value:1234.5, status:'online' },
        { entityId:'e-3f-2',   name:'Loja 102',      deviceType:'3F_MEDIDOR',         deviceProfile:'3F_MEDIDOR',         identifier:'LOJA-102', valueKey:'consumption', value:0,      status:'offline' },
        { entityId:'e-chil-1', name:'Chiller 01',    deviceType:'CHILLER',            deviceProfile:'CHILLER',            identifier:'CHILLER-01', valueKey:'consumption', value:890.2, status:'online' },
        { entityId:'e-ent-1',  name:'Entrada Geral', deviceType:'ENTRADA',            deviceProfile:'ENTRADA',            identifier:'ENT-01',   valueKey:'consumption', value:5000,   status:'online' },
        { entityId:'e-hid-1',  name:'Loja Água 1',   deviceType:'HIDROMETRO',         deviceProfile:'HIDROMETRO',         identifier:'HID-01',   valueKey:'pulses',      value:42.7,   status:'online' },
        { entityId:'e-hie-1',  name:'Entrada Água',  deviceType:'HIDROMETRO_ENTRADA', deviceProfile:'HIDROMETRO_ENTRADA', identifier:'HIDENT-01',valueKey:'pulses',      value:1200,   status:'online' },
      ];
      return D.flatMap(deviceRows);
    }

    // ---- settingsSchema.json → cockpit form (mirrors the TB widget "Appearance/Settings") ----
    const SCHEMA_URL = '../../src/thingsboard/main-dashboard-shopping/v-5.4.0/settingsSchema.json?v=' + Date.now();
    // showcase defaults + secrets come from config.json (gitignored). Never hardcoded here.
    // Config shape: { defaultEnv, environments: { LOCAL: {settings, apiKeys}, PROD: {settings, apiKeys} } }.
    let DEFAULT_OVERRIDES = {};
    let _apiKeyOptions = [];
    let _config = null;
    let _currentEnv = '';
    let _schema = null;
    let _bootCountdownSecs = 6; // overridable via config.json → "general-settings".bootCountdownSeconds

    // Load local config (gitignored). Falls back to the committed example template.
    async function loadConfig() {
      let cfg = null, src = '';
      for (const url of ['./config.json', './config.example.json']) {
        try {
          const r = await fetch(url + '?v=' + Date.now());
          if (r.ok) { cfg = await r.json(); src = url; break; }
        } catch {}
      }
      if (!cfg) { log('err', 'config.json/config.example.json não encontrados'); return; }
      _config = cfg;
      // Global (non-per-env) showcase settings.
      const gs = cfg['general-settings'] || cfg.generalSettings || {};
      if (gs.bootCountdownSeconds != null) _bootCountdownSecs = Math.max(0, Number(gs.bootCountdownSeconds) || 0);
      const envNames = Object.keys(cfg.environments || {});
      const saved = localStorage.getItem('sc-env');
      _currentEnv = (saved && envNames.includes(saved) && saved) || cfg.defaultEnv || envNames[0] || '';
      log('info', `config carregado de ${src} (envs: ${envNames.join(' | ') || '—'})${src.includes('example') ? ' — ⚠️ template; crie config.json com seus valores reais' : ''}`);
    }

    function populateApiKeySelect() {
      const sel = document.getElementById('sc-gcdrKey');
      sel.innerHTML = '';
      _apiKeyOptions.forEach((o, i) => {
        const opt = document.createElement('option');
        opt.value = o.value || ''; opt.textContent = o.label || o.value || '(sem label)';
        if (i === 0) opt.selected = true;
        sel.appendChild(opt);
      });
    }

    // Flatten nested settings ({darkMode:{backgroundColor}} → {"darkMode.backgroundColor"}) so they match
    // the dotted form keys used by renderField (arrays are kept as values, not flattened).
    function flattenSettings(obj, prefix, out) {
      out = out || {};
      for (const [k, v] of Object.entries(obj || {})) {
        const key = prefix ? `${prefix}.${k}` : k;
        if (v && typeof v === 'object' && !Array.isArray(v)) flattenSettings(v, key, out);
        else out[key] = v;
      }
      return out;
    }

    // Apply an environment: its settings become the form overrides, its apiKeys the X-API-Key options.
    function applyEnv(env) {
      if (!_config || !_schema) return;
      const e = _config.environments?.[env];
      if (!e) { log('err', `ambiente "${env}" ausente no config`); return; }
      _currentEnv = env;
      localStorage.setItem('sc-env', env);
      DEFAULT_OVERRIDES = flattenSettings(e.settings || {});
      _apiKeyOptions = Array.isArray(e.apiKeys) ? e.apiKeys : [];
      renderForm();            // re-render every field seeded with this env's settings + the env tab
      populateApiKeySelect();  // refresh X-API-Key options for this env
      log('info', `ambiente ${env} aplicado (${_apiKeyOptions.length} API key(s))`);
    }

    function buildEnvTab() {
      const wrap = document.createElement('div');
      wrap.className = 'sc-envtab'; wrap.id = 'sc-envtab';
      Object.keys(_config?.environments || {}).forEach((env) => {
        const b = document.createElement('button');
        b.type = 'button'; b.textContent = env; b.dataset.env = env;
        if (env === _currentEnv) b.classList.add('active');
        b.addEventListener('click', () => applyEnv(env));
        wrap.appendChild(b);
      });
      return wrap;
    }

    function schemaProp(path) {
      // resolve "darkMode.backgroundType" against schema.properties (nested object props)
      const parts = path.split('.');
      let node = _schema.schema.properties[parts[0]];
      for (let i = 1; i < parts.length && node; i++) node = node.properties?.[parts[i]];
      return node || {};
    }

    function renderField(key, typeOverride) {
      const p = schemaProp(key);
      const def = key in DEFAULT_OVERRIDES ? DEFAULT_OVERRIDES[key] : (p.default ?? '');
      const id = 'set__' + key;
      const title = p.title || key;
      const wrap = document.createElement('div');
      wrap.dataset.fieldkey = key;
      if (p.type === 'boolean') {
        wrap.className = 'sc-checkbox';
        wrap.innerHTML =
          `<input type="checkbox" id="${id}" data-setkey="${key}" data-kind="boolean" ${def ? 'checked' : ''}/>` +
          `<label for="${id}" style="margin:0">${title}</label>`;
        return wrap;
      }
      const lbl = document.createElement('label');
      lbl.textContent = title; lbl.setAttribute('for', id);
      wrap.appendChild(lbl);
      let field;
      if (Array.isArray(p.enum) || typeOverride === 'select') {
        field = document.createElement('select');
        (p.enum || []).forEach((opt) => {
          const o = document.createElement('option'); o.value = opt; o.textContent = opt;
          if (String(opt) === String(def)) o.selected = true;
          field.appendChild(o);
        });
        field.dataset.kind = 'string';
      } else if (p.type === 'number') {
        field = document.createElement('input'); field.type = 'number'; field.value = def; field.dataset.kind = 'number';
      } else if (p.type === 'array') {
        field = document.createElement('input'); field.type = 'text';
        field.value = (Array.isArray(def) ? def : []).join(', ');
        field.placeholder = 'comma-separated'; field.dataset.kind = 'array';
      } else {
        field = document.createElement('input'); field.type = typeOverride === 'color' ? 'color' : 'text';
        field.value = def; field.dataset.kind = 'string';
      }
      field.id = id; field.dataset.setkey = key;
      wrap.appendChild(field);
      return wrap;
    }

    function buildFieldset(item) {
      const fs = document.createElement('fieldset'); fs.className = 'sc-fieldset collapsed'; // default collapsed
      const lg = document.createElement('legend'); lg.className = 'sc-fs-legend';
      lg.innerHTML = `<span class="sc-fs-ico">▸</span> ${item.title || ''}`;
      const body = document.createElement('div'); body.className = 'sc-fs-body';
      for (const sub of item.items) {
        if (typeof sub === 'string') body.appendChild(renderField(sub));
        else body.appendChild(renderField(sub.key, sub.type));
      }
      lg.addEventListener('click', () => {
        const collapsed = fs.classList.toggle('collapsed');
        lg.querySelector('.sc-fs-ico').textContent = collapsed ? '▸' : '▾';
      });
      fs.appendChild(lg); fs.appendChild(body);
      return fs;
    }

    function renderForm() {
      const root = document.getElementById('sc-fields');
      root.innerHTML = '';
      const fieldsets = [];
      // first pass: simple fields in schema order
      for (const item of _schema.form) {
        if (typeof item === 'string') { root.appendChild(renderField(item)); continue; }
        if (item.type === 'fieldset') { fieldsets.push(item); continue; }
        root.appendChild(renderField(item.key, item.type)); // { key, type }
      }
      // collapsible fieldsets go LAST (bottom of the cockpit)
      for (const item of fieldsets) root.appendChild(buildFieldset(item));
      // env selector (LOCAL | PROD) right below "Enable Annotations Onboarding"
      const anchor = root.querySelector('[data-fieldkey="enableAnnotationsOnboarding"]');
      if (anchor && _config?.environments) anchor.insertAdjacentElement('afterend', buildEnvTab());
    }

    function assignPath(obj, path, val) {
      const parts = path.split('.'); let node = obj;
      for (let i = 0; i < parts.length - 1; i++) node = (node[parts[i]] ||= {});
      node[parts[parts.length - 1]] = val;
    }
    function readSettings() {
      // Seed from the active env's config settings so keys that are NOT rendered as form fields
      // (e.g. gcdrCustomerId / gcdrTenantId — removed from settingsSchema, but still needed by the
      // controller) reach ctx.settings. The editable form values are overlaid on top.
      const envSettings = _config?.environments?.[_currentEnv]?.settings || {};
      const settings = JSON.parse(JSON.stringify(envSettings));
      document.querySelectorAll('#sc-fields [data-setkey]').forEach((el) => {
        const key = el.dataset.setkey, kind = el.dataset.kind;
        let val;
        if (kind === 'boolean') val = el.checked;
        else if (kind === 'number') val = Number(el.value);
        else if (kind === 'array') val = el.value.split(',').map((s) => s.trim()).filter(Boolean);
        else val = el.value.trim();
        assignPath(settings, key, val);
      });
      return settings;
    }

    async function loadSchema() {
      try {
        const resp = await fetch(SCHEMA_URL);
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        _schema = await resp.json();
        log('info', `settingsSchema.json carregado (${_schema.form.length} form rows)`);
      } catch (err) {
        document.getElementById('sc-fields').innerHTML = '<span class="err">falha ao carregar settingsSchema.json</span>';
        log('err', 'loadSchema failed: ' + (err?.message || err));
      }
    }

    // Seed the simulated SERVER_SCOPE attrs. IMPORTANT: the controller resets
    // MyIOUtils.customerAttrs to {} at load (Object.assign), so this must also be
    // re-applied AFTER loadController() and BEFORE onInit() — otherwise X-API-Key is lost (401).
    function seedCustomerAttrs(gcdrTenantId) {
      window.MyIOUtils = window.MyIOUtils || {};
      window.MyIOUtils.customerAttrs = window.MyIOUtils.customerAttrs || {};
      window.MyIOUtils.customerAttrs.gcdrapikey = document.getElementById('sc-gcdrKey').value.trim();
      window.MyIOUtils.customerAttrs.gcdrtenantid = gcdrTenantId || '';
    }

    // ---- self.ctx (ThingsBoard widget context simulation) ----
    function buildCtx() {
      if (!_schema) { log('err', 'settingsSchema.json ainda não carregado'); return false; }
      const settings = readSettings();
      // /entities fetch reads X-API-Key from MyIOUtils.customerAttrs.gcdrapikey (simulated SERVER_SCOPE attr)
      seedCustomerAttrs(settings.gcdrTenantId);
      self.ctx = {
        settings,
        data: buildMockData(),
        datasources: [{ type: 'entity', name: 'AllDevices', aliasName: 'all3fs' }],
        currentUser: { email: 'showcase@myio.com.br', firstName: 'Showcase', lastName: 'User', authority: 'CUSTOMER_USER', customerTitle: 'Shopping (showcase)' },
        // real JWT from the login modal (localStorage), like the TB widget runtime
        http: { getServerCredentials: () => ({ token: localStorage.getItem('jwt_token') || '' }) },
        $scope: {},
        detectChanges: () => {},
      };
      log('info', `ctx ready — ${self.ctx.data.length} rows · gcdr ${settings.gcdrApiBaseUrl} · customer ${settings.gcdrCustomerId}`);
      return true;
    }

    // ---- inject the REAL v-5.4.0 template.html into #sc-stage (no inline copy → no drift) ----
    let _templateLoaded = false;
    async function loadTemplate() {
      if (_templateLoaded) return;
      const url = '../../src/thingsboard/main-dashboard-shopping/v-5.4.0/template.html?v=' + Date.now();
      const res = await fetch(url);
      if (!res.ok) throw new Error('template.html HTTP ' + res.status);
      document.getElementById('sc-stage').innerHTML = await res.text();
      _templateLoaded = true;
      log('info', 'v-5.4.0/template.html injected into #sc-stage');
    }

    // ---- load the v-5.4.0 controller (cache-busted) ----
    let _controllerLoaded = false;
    function loadController() {
      return new Promise((resolve, reject) => {
        if (_controllerLoaded) return resolve();
        const s = document.createElement('script');
        s.src = '../../src/thingsboard/main-dashboard-shopping/v-5.4.0/controller.js?v=' + Date.now();
        s.onload = () => { _controllerLoaded = true; log('info', 'v-5.4.0/controller.js loaded'); resolve(); };
        s.onerror = (e) => { log('err', 'failed to load controller.js'); reject(e); };
        document.body.appendChild(s);
      });
    }

    document.getElementById('sc-run').addEventListener('click', async () => {
      try {
        if (typeof MyIOLibrary === 'undefined') { log('err', 'MyIOLibrary (UMD) not loaded'); return; }
        if (!buildCtx()) return;
        await loadTemplate(); // inject template.html BEFORE onInit fills the containers
        await loadController();
        // controller wipes MyIOUtils.customerAttrs on load → re-seed so X-API-Key reaches /entities
        seedCustomerAttrs(self.ctx.settings.gcdrTenantId);
        if (typeof self.onInit !== 'function') { log('err', 'self.onInit not defined by controller'); return; }
        log('info', 'calling self.onInit() …');
        await self.onInit();
        log('info', 'onInit done — triggering onDataUpdated()');
        self.onDataUpdated?.();
      } catch (err) { log('err', 'run failed: ' + (err?.message || err)); }
    });
    document.getElementById('sc-data').addEventListener('click', () => {
      if (!buildCtx()) return; self.onDataUpdated?.(); log('info', 'onDataUpdated() called');
    });
    document.getElementById('sc-destroy').addEventListener('click', () => {
      self.onDestroy?.(); log('info', 'onDestroy() called');
    });
    document.getElementById('sc-toggle').addEventListener('click', () => {
      const collapsed = document.body.classList.toggle('console-collapsed');
      document.getElementById('sc-toggle').textContent = collapsed ? '⟨' : '⟩';
      document.getElementById('sc-toggle').title = collapsed ? 'Expandir cockpit' : 'Recolher cockpit';
    });
    document.getElementById('sc-log-toggle').addEventListener('click', () => {
      const c = document.getElementById('sc-console').classList.toggle('collapsed');
      document.getElementById('sc-log-toggle').textContent = c ? '▸ console' : '▾ console';
    });
    // Mobile preview: open the showcase in a phone-sized iframe. The iframe gets a REAL 390px
    // viewport, so the dashboard's @media (max-width) rules fire → true mobile layout
    // (resizing the element in this same document would NOT trigger media queries).
    document.getElementById('sc-mobile').addEventListener('click', () => {
      const btn = document.getElementById('sc-mobile');
      const close = () => {
        document.getElementById('sc-mobile-overlay')?.remove();
        btn.classList.remove('active'); btn.textContent = '📱 Emular Mobile';
      };
      if (document.getElementById('sc-mobile-overlay')) { close(); return; }
      const ov = document.createElement('div');
      ov.id = 'sc-mobile-overlay';
      ov.innerHTML =
        '<div class="sc-phone">' +
          '<div class="sc-phone-bar"><span>📱 Mobile preview — 390×844 (viewport real)</span>' +
          '<button id="sc-mobile-close" title="Fechar">✕ fechar</button></div>' +
          '<iframe class="sc-phone-screen" src="./index.html?embed=mobile&v=' + Date.now() + '"></iframe>' +
        '</div>';
      document.body.appendChild(ov);
      ov.addEventListener('click', (e) => { if (e.target === ov) close(); });
      document.getElementById('sc-mobile-close').addEventListener('click', close);
      btn.classList.add('active'); btn.textContent = '📱 Fechar Mobile';
      log('info', 'Mobile preview aberto (iframe @390px — dispara @media reais).');
    });

    // ---- real ThingsBoard login (POST {tbUrl}/api/auth/login → localStorage.jwt_token) ----
    function decodeJwt(t) { try { return JSON.parse(atob(t.split('.')[1])); } catch { return null; } }
    function tbBaseUrl() {
      const fromForm = document.getElementById('set__thingsboardUrl')?.value;
      return (fromForm || 'https://dashboard.myio-bas.com').trim().replace(/\/$/, '');
    }
    function updateAuthStatus() {
      const el = document.getElementById('sc-auth');
      const t = localStorage.getItem('jwt_token');
      const p = t && decodeJwt(t);
      const valid = p && p.exp > Math.floor(Date.now() / 1000);
      if (valid) {
        el.className = 'sc-auth ok';
        el.innerHTML = `✅ ${p.sub || 'autenticado'} · <a href="#" id="sc-logout" style="color:#9ecbff">logout</a>`;
        document.getElementById('sc-logout').onclick = (e) => {
          e.preventDefault();
          localStorage.removeItem('jwt_token'); localStorage.removeItem('refresh_token');
          updateAuthStatus(); log('info', 'logout — jwt_token removido');
        };
      } else {
        el.className = 'sc-auth no';
        el.innerHTML = t ? '⚠️ JWT expirado — refaça o login' : '🔒 sem JWT — clique "🔑 Login TB" (o modo mock funciona sem login)';
      }
    }
    async function tbLogin(username, password) {
      const resp = await fetch(`${tbBaseUrl()}/api/auth/login`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      if (!resp.ok) {
        let msg = 'Login falhou';
        try { msg = (await resp.json()).message || msg; } catch {}
        if (resp.status === 401) msg = 'Usuário ou senha inválidos';
        throw new Error(msg);
      }
      const data = await resp.json();
      localStorage.setItem('jwt_token', data.token);
      if (data.refreshToken) localStorage.setItem('refresh_token', data.refreshToken);
      return data.token;
    }
    const loginModal = document.getElementById('sc-login-modal');
    function openLogin() { document.getElementById('sc-login-err').style.display = 'none'; loginModal.classList.add('open'); document.getElementById('sc-login-user').focus(); }
    function closeLogin() { loginModal.classList.remove('open'); }
    document.getElementById('sc-login').addEventListener('click', openLogin);
    document.getElementById('sc-login-close').addEventListener('click', closeLogin);
    loginModal.addEventListener('click', (e) => { if (e.target === loginModal) closeLogin(); });
    document.getElementById('sc-login-eye').addEventListener('click', () => {
      const i = document.getElementById('sc-login-pass'); i.type = i.type === 'password' ? 'text' : 'password';
    });
    document.getElementById('sc-login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const u = document.getElementById('sc-login-user').value.trim();
      const p = document.getElementById('sc-login-pass').value;
      const errEl = document.getElementById('sc-login-err'), btn = document.getElementById('sc-login-submit');
      errEl.style.display = 'none';
      if (!u || !p) { errEl.textContent = 'Preencha usuário e senha'; errEl.style.display = 'block'; return; }
      btn.disabled = true; btn.innerHTML = '<span class="sc-spin"></span>Entrando...';
      try {
        await tbLogin(u, p);
        log('info', `login TB OK — jwt salvo (${tbBaseUrl()})`);
        closeLogin(); updateAuthStatus();
      } catch (err) {
        errEl.textContent = err?.message || 'Login falhou'; errEl.style.display = 'block';
        log('err', 'login: ' + (err?.message || err));
      } finally { btn.disabled = false; btn.textContent = 'Entrar'; }
    });

    // Full-screen blur countdown → auto-run onInit, then fully collapse the cockpit.
    // Cancel aborts (keeps the cockpit so you can run manually). One-shot per load — F5 to redo.
    function startBootCountdown() {
      const ov = document.getElementById('sc-boot');
      const countEl = document.getElementById('sc-boot-count');
      const secsEl = document.getElementById('sc-boot-secs');
      const cancelBtn = document.getElementById('sc-boot-cancel');
      if (!ov || !countEl) return;
      let n = _bootCountdownSecs, timer = null;
      const hide = () => { if (timer) clearInterval(timer); timer = null; ov.classList.add('hidden'); };
      const render = (v) => { countEl.textContent = Math.max(v, 0); if (secsEl) secsEl.textContent = Math.max(v, 0); };
      const runAndCollapse = () => {
        hide();
        log('info', 'Run onInit + colapsar cockpit.');
        document.getElementById('sc-run').click();
        document.body.classList.add('console-collapsed');         // colapsa o cockpit totalmente
        const tg = document.getElementById('sc-toggle');
        if (tg) { tg.textContent = '⟨'; tg.title = 'Expandir cockpit'; }
      };
      cancelBtn.addEventListener('click', () => {
        hide();
        log('warn', 'Auto-carregamento cancelado — use ▶ Run onInit manualmente.');
      });
      render(n);
      if (n <= 0) { runAndCollapse(); return; }   // countdown disabled (0) → run immediately
      timer = setInterval(() => {
        n -= 1;
        render(n);
        if (n <= 0) runAndCollapse();
      }, 1000);
    }

    window.addEventListener('load', async () => {
      await loadConfig();   // loads environments (config.json gitignored)
      await loadSchema();   // loads the schema (no render yet)
      applyEnv(_currentEnv); // renders the form for the active env + key options + LOCAL|PROD tab
      updateAuthStatus();
      log('info', typeof MyIOLibrary !== 'undefined'
        ? `MyIOLibrary loaded · parseClassificationEntities=${typeof MyIOLibrary.parseClassificationEntities}`
        : 'MyIOLibrary NOT loaded');
      // In the mobile-preview iframe, run the dashboard automatically (no cockpit to click).
      // Shares the parent's localStorage JWT (same origin); GCDR calls use the X-API-Key.
      if (EMBED_MOBILE) {
        log('info', 'embed-mobile: auto-running onInit…');
        document.getElementById('sc-run').click();
      } else {
        log('warn', 'Click "Run onInit" — fetches the GCDR /entities tree LIVE from the gcdrApiBaseUrl above (needs the GCDR server + CORS).');
        startBootCountdown();   // 6s blur countdown → auto Run onInit → collapse cockpit
      }
    });
  </script>
</body>
