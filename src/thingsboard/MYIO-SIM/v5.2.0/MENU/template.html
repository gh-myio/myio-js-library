<section class="myio-toolbar-root">
  <!-- ====== ABA / TABS + FILTRO ====== -->
  <div class="myio-tabs-row">
    <nav class="myio-tabs" role="tablist" aria-label="Seções">
      <!-- RFC-0079: Energia button with modal dropdown -->
      <button id="energyButton" class="tab is-active">
        <span class="ico">⚡</span>
        <span id="energyContextLabel">Energia: Equipamentos</span>
        <span class="dropdown-arrow">▼</span>
      </button>
      <!-- RFC-0087: Water button with modal dropdown -->
      <button id="waterButton" class="tab">
        <span class="ico">💧</span>
        <span id="waterContextLabel">Água: Resumo</span>
        <span class="dropdown-arrow">▼</span>
      </button>
      <!-- RFC-0092: Temperature button with modal dropdown -->
      <button id="temperatureButton" class="tab">
        <span class="ico">🌡️</span>
        <span id="temperatureContextLabel">Temperatura: Ambientes Climatizáveis</span>
        <span class="dropdown-arrow">▼</span>
      </button>
    </nav>

    <!-- Botão Metas (Goals Panel) -->
    <button id="myio-goals-btn" class="tab" title="Configurar metas de consumo de energia e água">
      <i class="material-icons">flag</i>
      Metas
    </button>

    <button class="myio-filter-btn" id="filterBtn" type="button" title="Filtro">
      <span class="ico">⎇</span> Filtro
    </button>

    <!-- range -->
    <button style="min-width: 350px" class="tab">
      <span class="ico">📅</span>
      <input
        style="width: 100%; height: 100%; border: none; cursor: pointer; text-align: center"
        type="text"
        name="startDatetimes"
        placeholder="Digite a data ou período"
        readonly
        title="Clique aqui para alterar o intervalo de datas"
      />
    </button>

    <button id="load-button" class="tab">
      <i class="material-icons">refresh</i>
      Carregar
    </button>

    <!-- Botão Limpar (Force Refresh) -->
    <button
      id="myio-clear-btn"
      class="tab"
      title="Limpar cache e recarregar (use se os dados ficarem travados)"
    >
      <i class="material-icons">delete_sweep</i>
      Limpar
    </button>

    <!-- RFC-0239: Reports Hub button -->
    <button
      id="reports-hub-btn"
      class="tab"
      title="Relatórios de energia, água, temperatura e demandas"
    >
      <span class="ico">📊</span>
      <span>Relatórios</span>
    </button>
  </div>

  <!-- RFC-0079: Energy context modal dropdown -->
  <div id="energyContextModal" class="energy-modal" style="display: none">
    <div class="energy-modal-content">
      <div class="energy-modal-header">
        <span class="ico">⚡</span>
        <span>Selecione o contexto de Energia</span>
      </div>
      <div class="energy-modal-options">
        <button
          class="energy-modal-option is-active"
          data-context="equipments"
          data-target="content_equipments"
        >
          <span class="option-ico">⚙️</span>
          <div class="option-info">
            <div class="option-title">Equipamentos</div>
            <div class="option-desc">Telemetria de equipamentos</div>
          </div>
          <span class="option-check">✓</span>
        </button>
        <button class="energy-modal-option" data-context="stores" data-target="content_store">
          <span class="option-ico">🏬</span>
          <div class="option-info">
            <div class="option-title">Lojas</div>
            <div class="option-desc">Telemetria de lojas</div>
          </div>
          <span class="option-check">✓</span>
        </button>
        <button class="energy-modal-option" data-context="general" data-target="content_energy">
          <span class="option-ico">⚡</span>
          <div class="option-info">
            <div class="option-title">Geral (Energia)</div>
            <div class="option-desc">Visão geral de energia</div>
          </div>
          <span class="option-check">✓</span>
        </button>
      </div>
    </div>
  </div>

  <!-- RFC-0087: Water context modal dropdown -->
  <div id="waterContextModal" class="water-modal" style="display: none">
    <div class="water-modal-content">
      <div class="water-modal-header">
        <span class="ico">💧</span>
        <span>Selecione o contexto de Água</span>
      </div>
      <div class="water-modal-options">
        <button
          class="water-modal-option"
          data-context="water_common_area"
          data-target="content_water_common_area"
        >
          <span class="option-ico">🏢</span>
          <div class="option-info">
            <div class="option-title">Área Comum</div>
            <div class="option-desc">Hidrômetros de áreas comuns</div>
          </div>
          <span class="option-check">✓</span>
        </button>
        <button class="water-modal-option" data-context="water_stores" data-target="content_water_stores">
          <span class="option-ico">🏬</span>
          <div class="option-info">
            <div class="option-title">Lojas</div>
            <div class="option-desc">Hidrômetros de lojas/lojistas</div>
          </div>
          <span class="option-check">✓</span>
        </button>
        <button class="water-modal-option is-active" data-context="water_summary" data-target="content_water">
          <span class="option-ico">📊</span>
          <div class="option-info">
            <div class="option-title">Resumo</div>
            <div class="option-desc">Visão geral de consumo de água</div>
          </div>
          <span class="option-check">✓</span>
        </button>
      </div>
    </div>
  </div>

  <!-- RFC-0092: Temperature context modal dropdown -->
  <div id="temperatureContextModal" class="temperature-modal" style="display: none">
    <div class="temperature-modal-content">
      <div class="temperature-modal-header">
        <span class="ico">🌡️</span>
        <span>Selecione o contexto de Temperatura</span>
      </div>
      <div class="temperature-modal-options">
        <button
          class="temperature-modal-option is-active"
          data-context="temperature_sensors"
          data-target="content_temperature_sensors"
        >
          <span class="option-ico">❄️</span>
          <div class="option-info">
            <div class="option-title">Sensores em Ambientes Climatizáveis</div>
            <div class="option-desc">Sensores em áreas com ar-condicionado</div>
          </div>
          <span class="option-check">✓</span>
        </button>
        <button
          class="temperature-modal-option"
          data-context="temperature_sensors_external"
          data-target="content_temperature_sensors_external"
        >
          <span class="option-ico">☀️</span>
          <div class="option-info">
            <div class="option-title">Sensores em Ambientes Não Climatizáveis</div>
            <div class="option-desc">Sensores em áreas externas ou sem climatização</div>
          </div>
          <span class="option-check">✓</span>
        </button>
        <button
          class="temperature-modal-option"
          data-context="temperature_comparison"
          data-target="content_temperature"
        >
          <span class="option-ico">📊</span>
          <div class="option-info">
            <div class="option-title">Resumo Geral</div>
            <div class="option-desc">Visão geral de temperatura entre shoppings</div>
          </div>
          <span class="option-check">✓</span>
        </button>
      </div>
    </div>
  </div>
</section>
