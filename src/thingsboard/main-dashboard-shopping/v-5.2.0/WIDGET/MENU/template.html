<section class="shops-menu-root">
  <div class="user-info" id="user-info">
    <!-- RFC-0139: Theme toggle icon (controlled by MAIN via myio:theme-changed event) -->
    <span id="theme-toggle-icon" class="theme-toggle-icon" title="Tema atual">☀️</span>
    <div class="user-name" id="user-name">Carregando...</div>
    <div class="user-email" id="user-email"></div>
  </div>

  <div class="menu-header">
    <button class="hamburger-btn">☰ Menu</button>
  </div>

  <nav class="menu-list">
    <a
      href="#"
      *ngFor="let link of links; let i = index"
      id="link{{ i }}"
      class="menu-item"
      (click)="changeDashboardState($event, link.stateId, i)"
      [class.active]="link.enableLink"
      [attr.data-icon]="getMenuIcon(link.stateId)"
    >
      <span class="menu-icon">{{ getMenuIcon(link.stateId) }}</span>
      <span class="label">{{ link.content }}</span>
    </a>
  </nav>

  <div class="menu-footer">
    <button id="logout-btn" class="logout-btn" (click)="handleLogout($event)" aria-label="Sair do sistema">
      <span class="logout-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
      </span>
      <span class="logout-text">Sair</span>
    </button>
  </div>

  <!-- RFC-0137: Library version display (content injected by LibraryVersionChecker component) -->
  <div id="lib-version-display" class="lib-version-display"></div>
</section>
